[package]
name = "sipibrain"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
local-connection-fixture = ["tokio/io-util"]

[dependencies]
argon2 = "=0.6.0"
axum = { version = "0.8", features = ["json", "query"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tower-sessions = { version = "=0.14.0", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "=0.15.0", features = ["sqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

